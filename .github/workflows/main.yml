---
name: Make

on:
  schedule:
    - cron: '0 0 1 * *'
  pull_request:
    branches:
      - main
      - 'alpha/**'
  push:
    branches:
      - main
      - 'alpha/**'

jobs:
  make:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash '.github/workflows/make.sh' setup

      - name: Setup on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install efl pkg-config llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix efl)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Build on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash '.github/workflows/make.sh' build

      - name: Runtime tests on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a cargo test -p efltk --test runtime

      - name: Headless example smoke tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a bash -euo pipefail -c '
            for example in first_window simple snake floppy_bird; do
              echo "Smoke testing $example"
              timeout 30s env EFLTK_SMOKE_TEST=1 LIBGL_ALWAYS_SOFTWARE=1 \
                "target/release/examples/$example"
            done
          '

      - name: Dependency hygiene
        shell: bash
        run: |
          cargo install cargo-machete --locked
          cargo machete

      - name: Setup on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          update: true
          pacboy: |
            efl:p
            rust:p
            pkg-config:p
            clang:p

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          bash '.github/workflows/make.sh' build

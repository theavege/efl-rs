---
name: Make

on:
  schedule:
    - cron: '0 0 1 * *'
  pull_request:
  push:
    branches:
      - main
      - 'alpha/**'

jobs:
  make:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash '.github/workflows/make.sh' setup

      - name: Build on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash '.github/workflows/make.sh' build

      - name: Setup on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          update: true
          pacboy: |
            efl:p
            rust:p
            pkg-config:p
            clang:p

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cargo clippy --quiet --workspace --lib --examples --features=all
          cargo test --workspace --lib
          cargo build --release --workspace --examples --features=all

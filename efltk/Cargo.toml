[package]
name = "efltk"
version = "0.0.8"
authors = ["Artem V. Ageev <artem.v.ageev@gmail.com>"]
license = "LGPL-2.1-only"
repository = "https://github.com/theavege/efl-rs"
homepage = "https://github.com/theavege/efl-rs"
description = "Enlightenment Foundation Libraries bindings in Rust"
keywords = ["EFL", "enlightenment"]
categories = ["api-bindings", "gui"]
edition = "2024"
rust-version = "1.85"
readme = "../README.md"

[dependencies]
efltk-sys = { path = "../efltk-sys", version = "=0.0.8" }

[features]
default = ["web", "map", "video", "photocam"]
web = []
map = []
video = []
photocam = []

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "blocking"] }
xlsxwriter = { version = "0" }
chrono = { version = "0.4" }
serde = { version="1", features = ["derive"] }
serde_json = { version = "1" }
regex = { version = "1.12" }
walkdir = { version = "2.5" }
